[project]
name = "vt-lang"
version = "0.1.0"
description = "vt-lang "
readme = "README.md"
authors = [
    { name = "Zhou Chang", email = "achang.zhou@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "safetensors>=0.7",
    "numpy>=2.2.6",
]

[project.scripts]
vt = "vt_lang.main:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The package lives directly under src/ but keeps the import name vt_lang.
package-dir = {"vt_lang" = "src"}
packages = ["vt_lang"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
